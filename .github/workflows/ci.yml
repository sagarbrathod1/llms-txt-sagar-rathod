name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # API and worker tests run against real Postgres: the behavior under test lives in SQL
    # (unique indexes, ON CONFLICT, SKIP LOCKED). The tests apply the migrations themselves.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: llms
          POSTGRES_PASSWORD: llms
          POSTGRES_DB: llms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llms -d llms_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://llms:llms@localhost:5432/llms_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
