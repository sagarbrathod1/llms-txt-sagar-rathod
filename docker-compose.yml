# Local Postgres for development. The API, worker and frontend run on the host.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: llms
      POSTGRES_PASSWORD: llms
      POSTGRES_DB: llms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llms -d llms"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
