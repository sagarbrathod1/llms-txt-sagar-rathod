# Fly.io config for the API, with the job worker embedded in it. One machine that stops when
# idle and starts on the next request keeps the service at $0 between uses.
# The hourly drain is a separate scheduled machine in this app; fly deploy doesn't manage it.

app = "llms-txt-sagar-rathod-api"
# Next to Neon's AWS us-east-1, so each query is a short hop.
primary_region = "iad"
# The lifespan waits up to 5 s for the embedded worker to hand its job back; uvicorn needs the
# rest. Fly's default (5 s) would SIGKILL mid-release and leave the job to stale recovery.
kill_timeout = 10

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Migrations run once per deploy, in a temporary machine that has the app's secrets.
  release_command = "python -m app.db"

[env]
  # The $0 mode: no separate always-on worker; the loop runs only while this machine is up.
  EMBEDDED_WORKER = "true"
  # Not secrets: the web app's origin, plus the local dev server so a frontend running on a
  # laptop can try changes against real data. Safe because the API has no cookies or auth:
  # CORS only limits which web pages may call it from a browser.
  CORS_ORIGINS = "https://llms-txt-sagar-rathod.vercel.app,http://localhost:3000"
  # This project's Vercel preview deployments, so a PR's preview can use the API. Two shapes:
  # per deployment (a 9-character hash) and per branch ("git-" + branch). Anchored, and ending
  # in this account's scope slug, which only this account can deploy under.
  CORS_ORIGIN_REGEX = '^https://llms-txt-sagar-rathod-(?:[a-z0-9]{9}|git-[a-z0-9-]+)-sagarbrathod1s-projects\.vercel\.app$'

[http_service]
  internal_port = 8000
  force_https = true
  # "stop", not "suspend": stop sends SIGTERM, so the embedded worker hands its running job
  # back to the queue. Suspend freezes the process with no signal, leaving the job claimed.
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Scale to zero when idle: Fly waives invoices under $5, and a stopped machine lets Neon
  # suspend too.
  min_machines_running = 0

  # /health never touches the database, so these checks don't keep Neon awake. They go to the
  # machine directly, not through Fly's proxy, so they don't count as traffic for auto-stop.
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# Measured on real crawls: they peak at ~250 MB RSS, too much for 256 MB.
# 1x CPU's 6.25% baseline throttled a big crawl until /health timed out; 2x has double that.
[[vm]]
  size = "shared-cpu-2x"
  memory = "512mb"
